<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Arcade Neon Roulette</title>
  <!-- Confetti library for winning celebration effects -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-dark: #0a0b10;
      --panel-bg: rgba(18, 22, 36, 0.85);
      --neon-cyan: #00f0ff;
      --neon-pink: #ff007f;
      --neon-gold: #ffd700;
      --neon-green: #00ff66;
      --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(157, 0, 255, 0.15), transparent 70%),
        linear-gradient(to bottom, #050608, #0d101d);
      color: #fff;
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Main Application Wrapper */
    .game-wrapper {
      display: flex;
      flex-direction: row;
      gap: 30px;
      max-width: 1200px;
      width: 100%;
      align-items: flex-start;
      justify-content: center;
    }

    @media (max-width: 950px) {
      .game-wrapper {
        flex-direction: column;
        align-items: center;
      }
    }

    /* Main Cabinet Housing */
    .arcade-machine {
      background: var(--panel-bg);
      border: 2px solid rgba(0, 240, 255, 0.3);
      border-radius: 24px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.15), inset 0 0 20px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(12px);
      padding: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 480px;
      position: relative;
    }

    .machine-header {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
    }

    .machine-title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #fff, var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    .machine-subtitle {
      font-size: 12px;
      color: #8a99ad;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    /* Stage Canvas / Ring Wrapper */
    .stage-container {
      position: relative;
      width: 380px;
      height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 25px;
    }

    /* Clean Center Decorative Ring (No cup stack tower) */
    .center-core {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.05) 0%, rgba(0, 0, 0, 0.4) 80%);
      border: 1px solid rgba(0, 240, 255, 0.15);
      box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .center-core::before {
      content: '';
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 1px dashed rgba(255, 255, 255, 0.1);
    }

    /* LED Ring Container */
    .ring-container {
      position: absolute;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      border: 10px solid rgba(255, 255, 255, 0.03);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.9), 0 0 15px rgba(0,0,0,0.5);
    }

    /* Individual 16 LED Ring Blocks */
    .ring-block {
      position: absolute;
      width: 52px;
      height: 52px;
      margin: -26px;
      border-radius: 10px;
      background: rgba(20, 25, 40, 0.8);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #6c7a89;
      transition: transform 0.15s ease, background-color 0.1s, border-color 0.1s, box-shadow 0.1s;
      cursor: pointer;
    }

    .ring-block:hover {
      border-color: var(--neon-cyan);
      color: #fff;
    }

    .ring-block .block-num {
      font-size: 13px;
    }

    .ring-block .status-icon {
      font-size: 10px;
      margin-top: 2px;
    }

    /* Block States */
    .ring-block.is-target {
      border-color: var(--neon-gold);
      color: var(--neon-gold);
      background: rgba(255, 215, 0, 0.08);
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }

    .ring-block.is-active {
      background: var(--neon-pink) !important;
      color: #fff !important;
      border-color: #fff !important;
      box-shadow: 0 0 25px var(--neon-pink), 0 0 45px var(--neon-pink) !important;
      transform: scale(1.18);
      z-index: 10;
    }

    .ring-block.is-captured {
      background: rgba(0, 255, 102, 0.25) !important;
      border-color: var(--neon-green) !important;
      color: var(--neon-green) !important;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.4) !important;
    }

    .ring-block.is-captured.is-active {
      background: var(--neon-green) !important;
      color: #000 !important;
      box-shadow: 0 0 30px var(--neon-green), 0 0 50px var(--neon-green) !important;
    }

    /* Arcade Action Controls */
    .arcade-controls {
      display: flex;
      gap: 15px;
      width: 100%;
      justify-content: center;
    }

    .btn-action {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.1s ease;
      box-shadow: 0 6px 0 rgba(0,0,0,0.5);
      position: relative;
      top: 0;
    }

    .btn-action:active {
      top: 4px;
      box-shadow: 0 2px 0 rgba(0,0,0,0.5);
    }

    .btn-stop {
      background: linear-gradient(135deg, #ff0055, #ff007f);
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
      border: 1px solid #ff66a3;
    }

    .btn-stop:hover {
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.6), 0 6px 0 rgba(0,0,0,0.5);
    }

    .btn-reset {
      background: linear-gradient(135deg, #00b894, #00ff66);
      color: #051b11;
      border: 1px solid #55ff99;
      max-width: 140px;
    }

    .btn-reset:hover {
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.5), 0 6px 0 rgba(0,0,0,0.5);
    }

    /* Developer / Control Panel */
    .settings-panel {
      background: var(--panel-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 22px;
      width: 380px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .panel-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--neon-cyan);
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-label {
      font-size: 12px;
      color: #a0aec0;
      display: flex;
      justify-content: space-between;
    }

    .control-value {
      color: var(--neon-gold);
      font-weight: bold;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--neon-cyan);
      cursor: pointer;
    }

    select {
      background: #121624;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 12px;
      border-radius: 8px;
      outline: none;
      font-family: inherit;
    }

    /* Target Selection Grid */
    .target-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      margin-top: 4px;
    }

    .target-btn {
      aspect-ratio: 1;
      background: #1a2035;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #a0aec0;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .target-btn.selected {
      background: var(--neon-gold);
      color: #000;
      border-color: #fff;
    }

    .quick-preset-row {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .preset-btn {
      flex: 1;
      padding: 6px 0;
      background: #1e2640;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #00f0ff;
      border-radius: 6px;
      font-size: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s;
    }

    .preset-btn:hover {
      background: rgba(0, 240, 255, 0.2);
    }

    /* Dynamic Speed Meter Bar */
    .speed-meter-box {
      background: rgba(0,0,0,0.4);
      border-radius: 10px;
      padding: 10px 14px;
      border: 1px solid rgba(0, 240, 255, 0.15);
    }

    .meter-label {
      font-size: 11px;
      color: #8a99ad;
      margin-bottom: 4px;
    }

    .meter-bar-bg {
      height: 8px;
      background: #1e2638;
      border-radius: 4px;
      overflow: hidden;
    }

    .meter-bar-fill {
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, var(--neon-green), var(--neon-gold), var(--neon-pink));
      transition: width 0.05s linear;
    }

    .status-banner {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-banner.win {
      background: rgba(0, 255, 102, 0.15);
      border-color: var(--neon-green);
      color: var(--neon-green);
    }

    .status-banner.miss {
      background: rgba(255, 0, 127, 0.15);
      border-color: var(--neon-pink);
      color: #ff99c8;
    }

    .captured-badge {
      font-size: 11px;
      color: var(--neon-green);
      font-weight: bold;
      background: rgba(0, 255, 102, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(0, 255, 102, 0.3);
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <!-- Main Machine Component -->
    <div class="arcade-machine">
      <div class="machine-header">
        <div class="machine-title">Cyber Arcade Roulette</div>
        <div class="machine-subtitle">點擊「STOP」立即停燈 ‧ 清除所有目標亮燈</div>
      </div>

      <!-- Ring Stage Container -->
      <div class="stage-container">
        <!-- Clean Center Core (No cup stack tower) -->
        <div class="center-core"></div>

        <!-- Circular 16 LED Ring -->
        <div class="ring-container" id="ringContainer"></div>
      </div>

      <!-- Live Machine Banner -->
      <div class="status-banner" id="statusBanner">
        點擊 STOP 按鈕或按下空白鍵 (Space) 開始挑戰！
      </div>

      <div style="height: 15px;"></div>

      <!-- Arcade Action Buttons -->
      <div class="arcade-controls">
        <button class="btn-action btn-stop" id="stopBtn">STOP !</button>
        <button class="btn-action btn-reset" id="resetBtn">RESET (重置)</button>
      </div>
    </div>

    <!-- Developer & Game Master Controls -->
    <div class="settings-panel">
      <div class="panel-title">
        <span>控制與參數面板</span>
        <span class="captured-badge" id="capturedCountTag">進度: 0 / 1</span>
      </div>

      <!-- Multi-Target Grid Selector -->
      <div class="control-group">
        <div class="control-label">
          <span>目標格子 (Multi-Targets)</span>
          <span id="targetCountText" class="control-value">已選 1 格</span>
        </div>
        <div class="target-grid" id="targetGrid"></div>
        <div class="quick-preset-row">
          <button class="preset-btn" onclick="setPresetTargets('single')">預設1格</button>
          <button class="preset-btn" onclick="setPresetTargets('even')">雙數格</button>
          <button class="preset-btn" onclick="setPresetTargets('odd')">單數格</button>
          <button class="preset-btn" onclick="setPresetTargets('corners')">4角落</button>
          <button class="preset-btn" onclick="setPresetTargets('all')">全選</button>
        </div>
      </div>

      <!-- Base Speed Slider -->
      <div class="control-group">
        <div class="control-label">
          <span>基礎速度 (Base Speed)</span>
          <span class="control-value" id="baseSpeedVal">30 ms</span>
        </div>
        <input type="range" id="baseSpeedSlider" min="5" max="50" step="1" value="30">
      </div>

      <!-- Fluctuation Amplitude Slider -->
      <div class="control-group">
        <div class="control-label">
          <span>波動振幅 (Fluctuation Amp)</span>
          <span class="control-value" id="fluctAmpVal">0 %</span>
        </div>
        <input type="range" id="fluctAmpSlider" min="0" max="100" step="5" value="0">
      </div>

      <!-- Fluctuation Pattern Selector -->
      <div class="control-group">
        <div class="control-label">
          <span>波動模式 (Fluctuation Pattern)</span>
        </div>
        <select id="fluctPatternSelect">
          <option value="random">隨機波動 (Random Variance)</option>
          <option value="sine">正弦波曲線 (Sine Wave)</option>
          <option value="circle">每圈加減速 (Circle Acc/Dec)</option>
          <option value="chaos">混沌噪音 (Chaos Noise)</option>
          <option value="none">無變化 (Constant Speed)</option>
        </select>
      </div>

      <!-- Real-time Delay Meter -->
      <div class="speed-meter-box">
        <div class="meter-label" style="display:flex; justify-content:space-between;">
          <span>當前圈轉速 (Lap Step Delay)</span>
          <span id="currentDelayVal" style="color:var(--neon-cyan); font-weight:bold;">30 ms</span>
        </div>
        <div class="meter-bar-bg">
          <div class="meter-bar-fill" id="meterBarFill"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- Global Game Engine Variables ---
    const TOTAL_CELLS = 16;
    let currentIndex = 0;
    let isRunning = true;
    let timerId = null;

    // Multi-Target Management State
    let targetSet = new Set([0]); // Default Target: Cell #1 (Index 0)
    let capturedSet = new Set();  // Holds hit target indexes

    // Speed Control Parameters (UPDATED DEFAULTS)
    let baseSpeed = 30;           // Default: 30 ms
    let fluctuationAmp = 0;       // Default: 0 %
    let fluctuationPattern = 'random';
    let currentStepDelay = 30;    // Delay applied to current step
    let currentLapFactor = 0;     // Speed factor updated strictly per lap

    // DOM Elements
    const ringContainer = document.getElementById('ringContainer');
    const targetGrid = document.getElementById('targetGrid');
    const stopBtn = document.getElementById('stopBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusBanner = document.getElementById('statusBanner');
    const baseSpeedSlider = document.getElementById('baseSpeedSlider');
    const baseSpeedVal = document.getElementById('baseSpeedVal');
    const fluctAmpSlider = document.getElementById('fluctAmpSlider');
    const fluctAmpVal = document.getElementById('fluctAmpVal');
    const fluctPatternSelect = document.getElementById('fluctPatternSelect');
    const currentDelayVal = document.getElementById('currentDelayVal');
    const meterBarFill = document.getElementById('meterBarFill');
    const targetCountText = document.getElementById('targetCountText');
    const capturedCountTag = document.getElementById('capturedCountTag');

    // Web Audio Synthesizer (No external audio file dependencies)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'tick') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.02);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
        osc.start(now);
        osc.stop(now + 0.02);
      } else if (type === 'win') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.08);
        osc.frequency.setValueAtTime(783.99, now + 0.16);
        osc.frequency.setValueAtTime(1046.50, now + 0.24);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
      } else if (type === 'miss') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(110, now + 0.15);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      }
    }

    // --- Build Circular LED Ring Layout ---
    function initRing() {
      ringContainer.innerHTML = '';
      const radius = 150; // Radius in pixels
      const centerX = 180;
      const centerY = 180;

      for (let i = 0; i < TOTAL_CELLS; i++) {
        const block = document.createElement('div');
        block.className = 'ring-block';
        block.dataset.index = i;

        // Angle positioning starting from top (-90 degrees)
        const angle = (i * (360 / TOTAL_CELLS) - 90) * (Math.PI / 180);
        const x = centerX + radius * Math.cos(angle);
        const y = centerY + radius * Math.sin(angle);

        block.style.left = `${x}px`;
        block.style.top = `${y}px`;

        block.innerHTML = `
          <span class="block-num">${i + 1}</span>
          <span class="status-icon" id="icon-${i}"></span>
        `;

        // Direct click to toggle cell as target
        block.addEventListener('click', () => toggleTarget(i));

        ringContainer.appendChild(block);
      }

      initTargetGridUI();
      updateRingVisuals();
    }

    // Build Selection Grid in Developer Panel
    function initTargetGridUI() {
      targetGrid.innerHTML = '';
      for (let i = 0; i < TOTAL_CELLS; i++) {
        const btn = document.createElement('button');
        btn.className = 'target-btn';
        btn.textContent = i + 1;
        btn.id = `target-grid-btn-${i}`;
        btn.addEventListener('click', () => toggleTarget(i));
        targetGrid.appendChild(btn);
      }
    }

    // Toggle individual target cell
    function toggleTarget(index) {
      if (targetSet.has(index)) {
        if (targetSet.size > 1) { // Maintain at least 1 active target
          targetSet.delete(index);
          capturedSet.delete(index);
        }
      } else {
        targetSet.add(index);
      }
      updateRingVisuals();
    }

    // Preset selection helper
    function setPresetTargets(type) {
      targetSet.clear();
      capturedSet.clear();
      if (type === 'single') {
        targetSet.add(0);
      } else if (type === 'even') {
        for (let i = 1; i < TOTAL_CELLS; i += 2) targetSet.add(i);
      } else if (type === 'odd') {
        for (let i = 0; i < TOTAL_CELLS; i += 2) targetSet.add(i);
      } else if (type === 'corners') {
        [0, 4, 8, 12].forEach(idx => targetSet.add(idx));
      } else if (type === 'all') {
        for (let i = 0; i < TOTAL_CELLS; i++) targetSet.add(i);
      }
      updateRingVisuals();
    }

    // Update LED visual states & labels
    function updateRingVisuals() {
      const blocks = document.querySelectorAll('.ring-block');
      blocks.forEach((block, idx) => {
        const iconSpan = document.getElementById(`icon-${idx}`);
        const gridBtn = document.getElementById(`target-grid-btn-${idx}`);

        block.classList.remove('is-target', 'is-active', 'is-captured');
        if (gridBtn) gridBtn.classList.remove('selected');

        // Target cell state
        if (targetSet.has(idx)) {
          block.classList.add('is-target');
          if (gridBtn) gridBtn.classList.add('selected');
          iconSpan.textContent = '🎯';
        } else {
          iconSpan.textContent = '';
        }

        // Captured target state
        if (capturedSet.has(idx)) {
          block.classList.add('is-captured');
          iconSpan.textContent = '✓';
        }

        // Current active light
        if (idx === currentIndex) {
          block.classList.add('is-active');
        }
      });

      // Update HUD counters
      targetCountText.textContent = `已選 ${targetSet.size} 格`;
      capturedCountTag.textContent = `進度: ${capturedSet.size} / ${targetSet.size}`;
    }

    // --- HARDCODED EVERY LAP Speed Engine ---
    function calculateNextDelay() {
      if (fluctuationPattern === 'none' || fluctuationAmp === 0) {
        return baseSpeed;
      }

      const ampFactor = fluctuationAmp / 100.0;

      // Recalculate speed factor ONLY upon full lap completion (currentIndex === 0)
      if (currentIndex === 0 || currentLapFactor === 0) {
        currentLapFactor = computeFactorPattern();
      }

      let calculatedDelay = baseSpeed * (1 + currentLapFactor * ampFactor);

      // Guardrail minimum delay
      return Math.max(1, Math.round(calculatedDelay));
    }

    // Compute pattern factor between -0.3 and +1.0
    function computeFactorPattern() {
      switch (fluctuationPattern) {
        case 'random':
          return (Math.random() * 1.0) - 0.3;
        case 'sine':
          return Math.sin((Math.random()) * Math.PI * 2);
        case 'circle':
          return (Math.random() * 0.8) - 0.4;
        case 'chaos':
          return Math.random() < 0.2 ? 1.2 : (Math.random() * 0.4 - 0.2);
        default:
          return 0;
      }
    }

    // --- Game Loop ---
    function step() {
      if (!isRunning) return;

      currentIndex = (currentIndex + 1) % TOTAL_CELLS;
      playSound('tick');

      // Update delay factor on every lap transition
      currentStepDelay = calculateNextDelay();
      updateRingVisuals();
      updateSpeedMeterUI();

      timerId = setTimeout(step, currentStepDelay);
    }

    function updateSpeedMeterUI() {
      currentDelayVal.textContent = `${currentStepDelay} ms`;
      const barPercent = Math.min(100, Math.max(5, ((currentStepDelay - 5) / 45) * 100));
      meterBarFill.style.width = `${barPercent}%`;
    }

    // --- Action: Instant Zero-Delay Stop ---
    function stopRoulette() {
      if (!isRunning) {
        // Resume rotation
        isRunning = true;
        stopBtn.textContent = 'STOP !';
        stopBtn.classList.remove('btn-reset');
        stopBtn.classList.add('btn-stop');
        statusBanner.className = 'status-banner';
        statusBanner.textContent = '轉動中... 隨時點擊 STOP 按鈕！';
        step();
        return;
      }

      // INSTANT HALT: Clear timer immediately
      clearTimeout(timerId);
      isRunning = false;

      stopBtn.textContent = '繼續 (CONTINUE)';
      stopBtn.classList.add('btn-reset');

      // Evaluate hit result
      evaluateHitResult();
    }

    // Evaluate target hit
    function evaluateHitResult() {
      const isTargetHit = targetSet.has(currentIndex);

      if (isTargetHit) {
        capturedSet.add(currentIndex);
        playSound('win');
        updateRingVisuals();

        if (capturedSet.size === targetSet.size) {
          statusBanner.className = 'status-banner win';
          statusBanner.textContent = `🎉 太厲害了！已擊中所有 ${targetSet.size} 個目標格子！`;
          confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        } else {
          statusBanner.className = 'status-banner win';
          statusBanner.textContent = `🎯 成功踩中第 ${currentIndex + 1} 格！(進度: ${capturedSet.size}/${targetSet.size})`;
          confetti({ particleCount: 40, spread: 50, origin: { y: 0.7 } });
        }
      } else {
        playSound('miss');
        statusBanner.className = 'status-banner miss';
        statusBanner.textContent = `❌ 停在第 ${currentIndex + 1} 格 (未命中目標)，再試一次！`;
      }
    }

    // --- Action: Reset Captured Targets ---
    function resetCapturedState() {
      capturedSet.clear();
      updateRingVisuals();
      statusBanner.className = 'status-banner';
      statusBanner.textContent = '已重置成功目標！點擊 STOP 重新挑戰！';
    }

    // --- Event Handlers ---
    stopBtn.addEventListener('click', stopRoulette);
    resetBtn.addEventListener('click', resetCapturedState);

    // Keyboard Shortcuts (Spacebar or Enter)
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        stopRoulette();
      }
    });

    // Control Panel Input Handlers
    baseSpeedSlider.addEventListener('input', (e) => {
      baseSpeed = parseInt(e.target.value, 10);
      baseSpeedVal.textContent = `${baseSpeed} ms`;
    });

    fluctAmpSlider.addEventListener('input', (e) => {
      fluctuationAmp = parseInt(e.target.value, 10);
      fluctAmpVal.textContent = `${fluctuationAmp} %`;
    });

    fluctPatternSelect.addEventListener('change', (e) => {
      fluctuationPattern = e.target.value;
    });

    // Start Game Engine
    initRing();
    step();
  </script>
</body>
</html>
