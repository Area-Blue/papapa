<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Arcade Neon Roulette</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-dark: #0a0b10;
      --panel-bg: rgba(18, 22, 36, 0.85);
      --neon-cyan: #00f0ff;
      --neon-pink: #ff007f;
      --neon-gold: #ffd700;
      --neon-green: #00ff66;
      --neon-purple: #9d00ff;
      --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(157, 0, 255, 0.15), transparent 70%),
        linear-gradient(to bottom, #050608, #0d101d);
      color: #fff;
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .game-wrapper {
      display: flex;
      flex-direction: row;
      gap: 30px;
      max-width: 1200px;
      width: 100%;
      align-items: flex-start;
      justify-content: center;
    }

    @media (max-width: 950px) {
      .game-wrapper {
        flex-direction: column;
        align-items: center;
      }
    }

    .arcade-machine {
      background: var(--panel-bg);
      border: 2px solid rgba(0, 240, 255, 0.3);
      border-radius: 24px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.15), inset 0 0 20px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(12px);
      padding: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 480px;
      position: relative;
    }

    .machine-header {
      text-align: center;
      margin-bottom: 15px;
      width: 100%;
    }

    .machine-title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #fff, var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    .machine-subtitle {
      font-size: 12px;
      color: #8a99ad;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    .stats-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 12px;
      padding: 8px 16px;
      margin-bottom: 15px;
    }

    .stat-box {
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      color: #8a99ad;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 800;
      color: var(--neon-gold);
    }

    .stage-container {
      position: relative;
      width: 380px;
      height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 25px;
    }

    .center-core {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.05) 0%, rgba(0, 0, 0, 0.4) 80%);
      border: 1px solid rgba(0, 240, 255, 0.15);
      box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .center-core::before {
      content: '';
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 1px dashed rgba(255, 255, 255, 0.1);
    }

    .ring-container {
      position: absolute;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      border: 10px solid rgba(255, 255, 255, 0.03);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.9), 0 0 15px rgba(0,0,0,0.5);
    }

    .ring-block {
      position: absolute;
      width: 52px;
      height: 52px;
      margin: -26px;
      border-radius: 10px;
      background: rgba(20, 25, 40, 0.8);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #6c7a89;
      transition: transform 0.15s ease, background-color 0.1s, border-color 0.1s, box-shadow 0.1s;
      cursor: pointer;
    }

    .ring-block:hover {
      border-color: var(--neon-cyan);
      color: #fff;
    }

    .ring-block .block-num {
      font-size: 13px;
    }

    .ring-block .status-icon {
      font-size: 10px;
      margin-top: 2px;
    }

    .ring-block.is-target {
      border-color: var(--neon-gold);
      color: var(--neon-gold);
      background: rgba(255, 215, 0, 0.08);
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }

    .ring-block.is-active {
      background: var(--neon-pink) !important;
      color: #fff !important;
      border-color: #fff !important;
      box-shadow: 0 0 25px var(--neon-pink), 0 0 45px var(--neon-pink) !important;
      transform: scale(1.18);
      z-index: 10;
    }

    .ring-block.is-captured {
      background: rgba(0, 255, 102, 0.25) !important;
      border-color: var(--neon-green) !important;
      color: var(--neon-green) !important;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.4) !important;
    }

    .ring-block.is-captured.is-active {
      background: var(--neon-green) !important;
      color: #000 !important;
      box-shadow: 0 0 30px var(--neon-green), 0 0 50px var(--neon-green) !important;
    }

    .arcade-controls {
      display: flex;
      gap: 15px;
      width: 100%;
      justify-content: center;
    }

    .btn-action {
      flex: 1;
      padding: 16px 10px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.1s ease;
      box-shadow: 0 6px 0 rgba(0,0,0,0.5);
      position: relative;
      top: 0;
      white-space: nowrap;
      min-width: 0;
    }

    .btn-action:active {
      top: 4px;
      box-shadow: 0 2px 0 rgba(0,0,0,0.5);
    }

    .btn-stop {
      background: linear-gradient(135deg, #ff0055, #ff007f);
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
      border: 1px solid #ff66a3;
    }

    .btn-stop:hover {
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.6), 0 6px 0 rgba(0,0,0,0.5);
    }

    .btn-continue {
      background: linear-gradient(135deg, #00b894, #00f0ff);
      color: #051b11;
      border: 1px solid #55ffff;
    }

    .btn-continue:hover {
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.6), 0 6px 0 rgba(0,0,0,0.5);
    }

    .btn-reset {
      background: linear-gradient(135deg, #34495e, #2c3e50);
      color: #ecf0f1;
      border: 1px solid #7f8c8d;
    }

    .btn-reset:hover {
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2), 0 6px 0 rgba(0,0,0,0.5);
    }

    .settings-panel {
      background: var(--panel-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 22px;
      width: 380px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--neon-cyan);
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-label {
      font-size: 12px;
      color: #a0aec0;
      display: flex;
      justify-content: space-between;
    }

    .control-value {
      color: var(--neon-gold);
      font-weight: bold;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--neon-cyan);
      cursor: pointer;
    }

    .target-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      margin-top: 4px;
    }

    .target-btn {
      aspect-ratio: 1;
      background: #1a2035;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #a0aec0;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .target-btn.selected {
      background: var(--neon-gold);
      color: #000;
      border-color: #fff;
    }

    .quick-preset-row {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .preset-btn {
      flex: 1;
      padding: 6px 0;
      background: #1e2640;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #00f0ff;
      border-radius: 6px;
      font-size: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s;
    }

    .preset-btn:hover {
      background: rgba(0, 240, 255, 0.2);
    }

    .speed-meter-box {
      background: rgba(0,0,0,0.4);
      border-radius: 10px;
      padding: 10px 14px;
      border: 1px solid rgba(0, 240, 255, 0.15);
    }

    .meter-label {
      font-size: 11px;
      color: #8a99ad;
      margin-bottom: 4px;
    }

    .meter-bar-bg {
      height: 8px;
      background: #1e2638;
      border-radius: 4px;
      overflow: hidden;
    }

    .meter-bar-fill {
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, var(--neon-green), var(--neon-gold), var(--neon-pink));
      transition: width 0.05s linear;
    }

    .status-banner {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-banner.win {
      background: rgba(0, 255, 102, 0.15);
      border-color: var(--neon-green);
      color: var(--neon-green);
    }

    .status-banner.miss {
      background: rgba(255, 0, 127, 0.15);
      border-color: var(--neon-pink);
      color: #ff99c8;
    }

    .captured-badge {
      font-size: 11px;
      color: var(--neon-green);
      font-weight: bold;
      background: rgba(0, 255, 102, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(0, 255, 102, 0.3);
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <div class="arcade-machine">
      <div class="machine-header">
        <div class="machine-title">Cyber Arcade Roulette</div>
        <div class="machine-subtitle">點擊「START」解鎖音效並開始挑戰</div>
      </div>

      <div class="stats-bar">
        <div class="stat-box">
          <div class="stat-label">累積遊玩次數</div>
          <div class="stat-value" id="playsVal">0</div>
        </div>
      </div>

      <div class="stage-container">
        <div class="center-core"></div>
        <div class="ring-container" id="ringContainer"></div>
      </div>

      <div class="status-banner" id="statusBanner">
        點擊 START 按鈕或按下空白鍵 (Space) 開始遊戲！
      </div>

      <div style="height: 15px;"></div>

      <div class="arcade-controls">
        <button class="btn-action btn-continue" id="stopBtn">START !</button>
        <button class="btn-action btn-reset" id="resetBtn">RESET (重置)</button>
      </div>
    </div>

    <div class="settings-panel">
      <div class="panel-title">
        <span>控制與參數面板</span>
        <span class="captured-badge" id="capturedCountTag">進度: 0 / 5</span>
      </div>

      <!-- Master Volume Control -->
      <div class="control-group">
        <div class="control-label">
          <span>總音量 (Master Volume)</span>
          <span class="control-value" id="masterVolVal">50 %</span>
        </div>
        <input type="range" id="masterVolSlider" min="0" max="100" step="5" value="50">
      </div>

      <!-- Target Grid Selection -->
      <div class="control-group">
        <div class="control-label">
          <span>目標格子 (Multi-Targets)</span>
          <span id="targetCountText" class="control-value">已選 5 格</span>
        </div>
        <div class="target-grid" id="targetGrid"></div>
        <div class="quick-preset-row">
          <button class="preset-btn" onclick="setPresetTargets('default')">預設5格</button>
          <button class="preset-btn" onclick="setPresetTargets('even')">雙數格</button>
          <button class="preset-btn" onclick="setPresetTargets('odd')">單數格</button>
          <button class="preset-btn" onclick="setPresetTargets('corners')">4角落</button>
          <button class="preset-btn" onclick="setPresetTargets('all')">全選</button>
        </div>
      </div>

      <!-- Base Speed Variable Slider (10ms to 40ms) -->
      <div class="control-group">
        <div class="control-label">
          <span>基礎速度 (Base Speed)</span>
          <span class="control-value" id="baseSpeedVal">30 ms</span>
        </div>
        <input type="range" id="baseSpeedSlider" min="10" max="40" step="1" value="30">
      </div>

      <!-- Fluctuation Amplitude Slider -->
      <div class="control-group">
        <div class="control-label">
          <span>每圈波動振幅 (Lap Fluctuation Amp)</span>
          <span class="control-value" id="fluctAmpVal">0 %</span>
        </div>
        <input type="range" id="fluctAmpSlider" min="0" max="100" step="5" value="0">
      </div>

      <!-- Real-Time Speed Meter -->
      <div class="speed-meter-box">
        <div class="meter-label" style="display:flex; justify-content:space-between;">
          <span>當前圈轉速 (Lap Step Delay)</span>
          <span id="currentDelayVal" style="color:var(--neon-cyan); font-weight:bold;">30 ms</span>
        </div>
        <div class="meter-bar-bg">
          <div class="meter-bar-fill" id="meterBarFill"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const TOTAL_CELLS = 16;
      let currentIndex = 0;
      let isRunning = false;
      let timerId = null;

      let playsCount = 0;
      // Default Targets: Cells 5, 7, 9, 11, 13 (0-indexed: 4, 6, 8, 10, 12)
      let targetSet = new Set([4, 6, 8, 10, 12]);
      let capturedSet = new Set();

      let baseSpeed = 30;           // Range: 10ms to 40ms (Default: 30ms)
      let fluctuationAmp = 0;       // Range: 0% to 100% (Default: 0%)
      let currentStepDelay = 30;
      let currentLapFactor = 0;     // Fixed speed factor applied for each full lap
      let lastFrameTime = 0;

      let masterVolume = 0.5;

      const ringContainer = document.getElementById('ringContainer');
      const targetGrid = document.getElementById('targetGrid');
      const stopBtn = document.getElementById('stopBtn');
      const resetBtn = document.getElementById('resetBtn');
      const statusBanner = document.getElementById('statusBanner');
      const playsVal = document.getElementById('playsVal');
      const baseSpeedSlider = document.getElementById('baseSpeedSlider');
      const baseSpeedVal = document.getElementById('baseSpeedVal');
      const fluctAmpSlider = document.getElementById('fluctAmpSlider');
      const fluctAmpVal = document.getElementById('fluctAmpVal');
      const masterVolSlider = document.getElementById('masterVolSlider');
      const masterVolVal = document.getElementById('masterVolVal');
      const currentDelayVal = document.getElementById('currentDelayVal');
      const meterBarFill = document.getElementById('meterBarFill');
      const targetCountText = document.getElementById('targetCountText');
      const capturedCountTag = document.getElementById('capturedCountTag');

      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      let bgmStepIndex = 0;
      let nextNoteTime = 0;
      let bgmTimerId = null;

      function playSound(type) {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const now = audioCtx.currentTime;
        const gainNode = audioCtx.createGain();
        gainNode.connect(audioCtx.destination);

        if (type === 'tick') {
          const osc = audioCtx.createOscillator();
          osc.connect(gainNode);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.02);
          
          gainNode.gain.setValueAtTime(0.25 * masterVolume, now);
          gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
          
          osc.start(now);
          osc.stop(now + 0.02);
        } else if (type === 'win') {
          const osc = audioCtx.createOscillator();
          osc.connect(gainNode);
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          osc.frequency.setValueAtTime(783.99, now + 0.16);
          osc.frequency.setValueAtTime(1046.50, now + 0.24);
          
          gainNode.gain.setValueAtTime(0.4 * masterVolume, now);
          gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          
          osc.start(now);
          osc.stop(now + 0.5);
        } else if (type === 'miss') {
          const osc = audioCtx.createOscillator();
          osc.connect(gainNode);
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(110, now + 0.15);
          
          gainNode.gain.setValueAtTime(0.3 * masterVolume, now);
          gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          
          osc.start(now);
          osc.stop(now + 0.15);
        }
      }

      function scheduleBGM() {
        if (!isRunning) return;
        const now = audioCtx.currentTime;

        if (nextNoteTime <= now + 0.1) {
          const bassNotes = [110, 110, 130.81, 110, 146.83, 110, 130.81, 98.00];
          const freq = bassNotes[bgmStepIndex % bassNotes.length];

          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const filter = audioCtx.createBiquadFilter();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, nextNoteTime);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(600, nextNoteTime);

          gain.gain.setValueAtTime(0.12 * masterVolume, nextNoteTime);
          gain.gain.exponentialRampToValueAtTime(0.001, nextNoteTime + 0.1);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(nextNoteTime);
          osc.stop(nextNoteTime + 0.1);

          if (bgmStepIndex % 2 === 1) {
            const hatOsc = audioCtx.createOscillator();
            const hatGain = audioCtx.createGain();
            hatOsc.type = 'square';
            hatOsc.frequency.setValueAtTime(7000, nextNoteTime);
            hatGain.gain.setValueAtTime(0.06 * masterVolume, nextNoteTime);
            hatGain.gain.exponentialRampToValueAtTime(0.001, nextNoteTime + 0.03);
            hatOsc.connect(hatGain);
            hatGain.connect(audioCtx.destination);
            hatOsc.start(nextNoteTime);
            hatOsc.stop(nextNoteTime + 0.03);
          }

          nextNoteTime += 0.12;
          bgmStepIndex++;
        }

        bgmTimerId = setTimeout(scheduleBGM, 25);
      }

      function startBGM() {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        bgmStepIndex = 0;
        nextNoteTime = audioCtx.currentTime;
        scheduleBGM
