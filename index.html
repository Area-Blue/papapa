<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyberpunk Arcade Neon Roulette</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-dark: #0a0b10;
      --panel-bg: rgba(18, 22, 36, 0.90);
      --neon-cyan: #00f0ff;
      --neon-pink: #ff007f;
      --neon-gold: #ffd700;
      --neon-green: #00ff66;
      --neon-purple: #9d00ff;
      --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(157, 0, 255, 0.15), transparent 70%),
        linear-gradient(to bottom, #050608, #0d101d);
      color: #fff;
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      overflow-x: hidden;
    }

    .game-wrapper {
      display: flex;
      flex-direction: row;
      gap: 20px;
      max-width: 1100px;
      width: 100%;
      align-items: flex-start;
      justify-content: center;
    }

    @media (max-width: 900px) {
      .game-wrapper {
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }
    }

    .arcade-machine {
      background: var(--panel-bg);
      border: 2px solid rgba(0, 240, 255, 0.3);
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.15), inset 0 0 20px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(12px);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 440px;
      position: relative;
    }

    .machine-header {
      text-align: center;
      margin-bottom: 12px;
      width: 100%;
    }

    .machine-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #fff, var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    .machine-subtitle {
      font-size: 11px;
      color: #8a99ad;
      margin-top: 4px;
      letter-spacing: 0.5px;
    }

    .stats-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 10px;
      padding: 6px 12px;
      margin-bottom: 12px;
    }

    .stat-box {
      text-align: center;
    }

    .stat-label {
      font-size: 10px;
      color: #8a99ad;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 800;
      color: var(--neon-gold);
    }

    .stage-container {
      position: relative;
      width: 100%;
      max-width: 350px;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .wheel-svg-container {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.9), 0 0 15px rgba(0, 240, 255, 0.2);
      position: relative;
    }

    .wheel-slice {
      fill: rgba(20, 25, 42, 0.85);
      stroke: rgba(0, 240, 255, 0.3);
      stroke-width: 1.5;
      cursor: pointer;
      touch-action: manipulation;
      transition: fill 0.12s ease;
    }

    .wheel-slice:hover {
      fill: rgba(0, 240, 255, 0.25);
    }

    .wheel-slice.is-target {
      fill: rgba(255, 215, 0, 0.25);
      stroke: var(--neon-gold);
      stroke-width: 2;
    }

    .wheel-slice.is-captured {
      fill: rgba(0, 255, 102, 0.3);
      stroke: var(--neon-green);
      stroke-width: 2;
    }

    .wheel-slice.is-active {
      fill: var(--neon-pink) !important;
      stroke: #ffffff !important;
      stroke-width: 3 !important;
      filter: drop-shadow(0 0 10px var(--neon-pink));
    }

    .wheel-slice.is-captured.is-active {
      fill: var(--neon-green) !important;
      stroke: #ffffff !important;
      stroke-width: 3 !important;
      filter: drop-shadow(0 0 10px var(--neon-green));
    }

    .slice-text {
      font-size: 12px;
      font-weight: 800;
      fill: #8a99ad;
      pointer-events: none;
    }

    .slice-text.is-target {
      fill: var(--neon-gold);
    }

    .slice-text.is-captured {
      fill: var(--neon-green);
    }

    .slice-text.is-active {
      fill: #ffffff;
      font-size: 14px;
    }

    .center-hub {
      position: absolute;
      width: 32%;
      height: 32%;
      border-radius: 50%;
      background: radial-gradient(circle, #121624 0%, #080a10 100%);
      border: 2px solid var(--neon-cyan);
      box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.3), 0 0 20px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 5;
    }

    .center-hub-ring {
      position: absolute;
      width: 75%;
      height: 75%;
      border-radius: 50%;
      border: 1px dashed rgba(255, 255, 255, 0.2);
    }

    .arcade-controls {
      display: flex;
      gap: 12px;
      width: 100%;
      justify-content: center;
    }

    .btn-action {
      flex: 1;
      padding: 14px 10px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      touch-action: manipulation;
      text-transform: uppercase;
      transition: all 0.1s ease;
      box-shadow: 0 5px 0 rgba(0,0,0,0.5);
      position: relative;
      top: 0;
      white-space: nowrap;
      min-width: 0;
    }

    .btn-action:active:not(:disabled) {
      top: 3px;
      box-shadow: 0 2px 0 rgba(0,0,0,0.5);
    }

    .btn-action:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
      filter: grayscale(0.8);
    }

      background: linear-gradient(135deg, #ff0055, #ff007f);
      color
